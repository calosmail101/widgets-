name: APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Pruebas y APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease -PversionCode=${{ github.run_number }}
      - run: cp app/build/outputs/apk/release/app-release.apk palanca.apk
      - uses: actions/upload-artifact@v4
        with:
          name: palanca-apk
          path: palanca.apk
      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest palanca.apk --target "$GITHUB_SHA" \
            --title "Palanca · compilación ${{ github.run_number }}" \
            --notes "APK generado automáticamente desde main. Instálalo encima del anterior: conserva tu configuración."
